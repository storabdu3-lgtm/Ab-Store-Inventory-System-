<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Multi-Store Inventory & E-commerce System</title>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchStore = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchStore;
            },
            set: function(val) {
              fetchStore = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Fetch patch skipped:", e);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
